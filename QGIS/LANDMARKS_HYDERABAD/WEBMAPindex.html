<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hyderabad Tourism & Accessibility Map</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        .title-box {
            background: white;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([17.3850, 78.4867], 10);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);


/* ---------------- TOURISM ---------------- */

var tourismLayer = L.geoJSON(null, {
    pointToLayer: function(feature, latlng) {
        return L.circleMarker(latlng, {
            radius: 6,
            fillOpacity: 0.8
        });
    },

    onEachFeature: function(feature, layer) {
        var p = feature.properties;

        layer.bindPopup(
            "<b>Tourism Attraction</b><br><br>" +
            "<b>Name:</b> " + (p.Name || "Not available") + "<br>" +
            "<b>Description:</b> " + (p.description || "Not available")
        );
    }
}).addTo(map);


/* ---------------- METRO ---------------- */

var metroLayer = L.geoJSON(null, {
    pointToLayer: function(feature, latlng) {
        return L.circleMarker(latlng, {
            radius: 5,
            fillOpacity: 0.9
        });
    },

    onEachFeature: function(feature, layer) {
        var p = feature.properties;

        layer.bindPopup(
            "<b>Metro Station</b><br><br>" +
            "<b>Name:</b> " + (p.name || p.Name || "Not available")
        );
    }
}).addTo(map);


/* ---------------- ROADS ---------------- */

var roadsLayer = L.geoJSON(null, {
    style: {
        weight: 3
    },

    onEachFeature: function(feature, layer) {
        var p = feature.properties;

        layer.bindPopup(
            "<b>Major Road</b><br><br>" +
            "<b>Name:</b> " + (p.name || p.Name || "Not available") +
            "<br><b>Type:</b> Primary Road"
        );
    }
}).addTo(map);


/* ---------------- PARKS ---------------- */

var parksLayer = L.geoJSON(null, {
    style: {
        fillOpacity: 0.5,
        weight: 1
    },

    onEachFeature: function(feature, layer) {
        var p = feature.properties;

        layer.bindPopup(
            "<b>Park / Green Space</b><br><br>" +
            "<b>Name:</b> " + (p.name || p.Name || "Not available")
        );
    }
}).addTo(map);


/* ---------------- WATER BODIES ---------------- */

var waterLayer = L.geoJSON(null, {
    style: {
        fillOpacity: 0.5,
        weight: 1
    },

    onEachFeature: function(feature, layer) {
        var p = feature.properties;

        layer.bindPopup(
            "<b>Water Body</b><br><br>" +
            "<b>Name:</b> " + (p.name || p.Name || "Not available")
        );
    }
}).addTo(map);


/* ---------------- BOUNDARY ---------------- */

var boundaryLayer = L.geoJSON(null, {
    style: {
        fill: false,
        weight: 3
    },

    onEachFeature: function(feature, layer) {
        layer.bindPopup("<b>Hyderabad Study Area</b>");
    }
}).addTo(map);


/* ---------------- LOAD GEOJSON FILES ---------------- */

fetch("../hyderabad_tourism_attractions.geojson")
    .then(response => response.json())
    .then(data => tourismLayer.addData(data));

fetch("../hyderabad_metro_stations.geojson")
    .then(response => response.json())
    .then(data => metroLayer.addData(data));

fetch("../hyderabad_major_roads.geojson")
    .then(response => response.json())
    .then(data => roadsLayer.addData(data));

fetch("../hyderabad_parks.geojson")
    .then(response => response.json())
    .then(data => parksLayer.addData(data));

fetch("../hyderabad_waterbodies.geojson")
    .then(response => response.json())
    .then(data => waterLayer.addData(data));

fetch("../hyderabad_boundary.geojson")
    .then(response => response.json())
    .then(data => boundaryLayer.addData(data));


/* ---------------- LAYER CONTROL ---------------- */

var overlays = {
    "Tourism Attractions": tourismLayer,
    "Metro Stations": metroLayer,
    "Major Roads": roadsLayer,
    "Parks": parksLayer,
    "Water Bodies": waterLayer,
    "Hyderabad Boundary": boundaryLayer
};

L.control.layers(null, overlays).addTo(map);


/* ---------------- TITLE ---------------- */

var title = L.control({position: 'topright'});

title.onAdd = function(map) {
    var div = L.DomUtil.create('div', 'title-box');
    div.innerHTML = 'Hyderabad Tourism & Accessibility Map';
    return div;
};

title.addTo(map);

</script>

</body>
</html>
